<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#121016">

<title>Locker</title>

<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --ink:#121016; --ink2:#1b1721; --ink3:#26202e; --line:#2f2938;
  --silver:#e9e6ef; --dim:#9a93a8; --faint:#6c6579;
  --accent:#ff4d6d; --accent-ink:#2a0a12;
  --danger:#ff5b5b; --ok:#5fd39a;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
body.v-family{--accent:#f2b84b;--accent-ink:#2b1d00}
body.v-other{--accent:#6ec6ff;--accent-ink:#06202f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--silver);overflow:hidden;
  font-family:"Noto Sans Devanagari","Mukta","Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
.view{position:fixed;inset:0;display:flex;flex-direction:column}
body.curtain #home,body.curtain #viewer{filter:blur(24px) brightness(.5)}

/* ---------- lock + setup ---------- */
#lock{align-items:center;justify-content:center;padding:calc(24px + var(--top)) 24px calc(24px + var(--bot));text-align:left}
.lockbox{width:100%;max-width:340px}
.logo{width:84px;height:84px;display:block;margin:0 0 22px}
.logo .blade{transform-origin:50px 50px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lockbox h1{font-size:26px;font-weight:700;letter-spacing:-.2px}
.lockbox p.sub{color:var(--dim);font-size:14.5px;margin:4px 0 22px;max-width:30ch}
.pw{width:100%;background:var(--ink2);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:19px;letter-spacing:.14em;margin-bottom:10px}
.pw::placeholder{letter-spacing:0;color:var(--faint);font-size:16px}
.pw:focus{outline:none;border-color:var(--accent)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--dim);font-weight:600;font-size:14.5px;padding:12px}
.msg{min-height:22px;font-size:14px;color:var(--danger);margin:2px 0 8px}
.rec{background:var(--ink2);border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin:10px 0;word-break:break-all;font-weight:700;letter-spacing:.12em;font-size:15.5px}
.rec small{display:block;font-weight:400;letter-spacing:0;color:var(--dim);margin-bottom:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--silver);margin:12px 0}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.steps{color:var(--faint);font-size:13px;margin-bottom:10px}

/* ---------- home ---------- */
#home{background:var(--ink)}
#home.reveal{animation:iris .75s cubic-bezier(.3,.7,.2,1) both}
@keyframes iris{from{clip-path:circle(0% at 50% 38%)}to{clip-path:circle(150% at 50% 38%)}}
@media (prefers-reduced-motion:reduce){#home.reveal{animation:none}}
.top{padding:calc(12px + var(--top)) 16px 8px;display:flex;align-items:center;gap:8px}
.top h2{font-size:22px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h2 i{font-style:normal;margin-right:6px}
.ib{width:42px;height:42px;border-radius:12px;background:var(--ink2);display:grid;place-items:center;font-size:19px;flex:none}
.ib.panic{background:#3a1216;color:#ff7b7b}
.searchrow{padding:0 16px 8px}
.search{width:100%;background:var(--ink2);border:1.5px solid transparent;border-radius:12px;padding:11px 14px;font-size:15.5px}
.search:focus{outline:none;border-color:var(--line)}
.crumbs{padding:2px 16px 8px;font-size:13.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{color:var(--dim);padding:2px 0}.crumbs button.cur{color:var(--silver);font-weight:700}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(110px + var(--bot))}
.rolls{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.rolls::-webkit-scrollbar{display:none}
.roll{flex:none;min-width:112px;background:var(--ink2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.roll b{display:block;font-size:15px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roll span{font-size:12.5px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 3px}
@media (min-width:560px){.grid{grid-template-columns:repeat(5,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(8,1fr)}}
.tile{position:relative;aspect-ratio:1;background:var(--ink2);overflow:hidden;border-radius:3px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .fr{position:absolute;left:5px;bottom:3px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;opacity:.8;font-variant-numeric:tabular-nums}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--faint)}
.tile .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none}
.sel .tile .tick{display:block}
.tile.on{outline:3px solid var(--accent);outline-offset:-3px}
.tile.on .tick{background:var(--accent);border-color:var(--accent)}
.empty{padding:56px 28px;color:var(--dim);text-align:left;max-width:34ch}
.empty b{display:block;color:var(--silver);font-size:18px;margin-bottom:4px}
.fab{position:fixed;right:18px;bottom:calc(78px + var(--bot));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:700;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--ink2);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--bot));z-index:4}
.nav button{flex:1;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--dim);font-weight:600}
.nav button span{font-size:21px;line-height:1.2}
.nav button.on{color:var(--accent)}
.selbar{position:fixed;left:0;right:0;top:0;background:var(--ink3);padding:calc(10px + var(--top)) 12px 10px;display:flex;align-items:center;gap:6px;z-index:8}
.selbar b{flex:1;font-size:16px}
.selbar button{padding:9px 12px;border-radius:10px;background:var(--ink2);font-size:14.5px;font-weight:600}
.selbar button.d{color:var(--danger)}
.pbar{position:fixed;left:0;right:0;top:0;height:4px;background:var(--accent);transform-origin:left;transform:scaleX(0);z-index:30;transition:transform .2s}

/* ---------- viewer ---------- */
#viewer{background:#000;z-index:20}
#viewer .vt{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--top)) 12px 8px;color:#fff;position:absolute;left:0;right:0;top:0;background:linear-gradient(#000a,#0000);z-index:2}
#viewer .vt b{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .vt button,#viewer .vb button{width:44px;height:44px;border-radius:12px;font-size:20px;background:#ffffff1a}
#viewer .vb{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 12px calc(12px + var(--bot));background:linear-gradient(#0000,#000a);z-index:2}
#vstage{flex:1;display:grid;place-items:center;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
#vstage img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s}
#vstage img.z{max-width:none;max-height:none;width:200%}
.vc{position:absolute;bottom:calc(70px + var(--bot));left:0;right:0;text-align:center;color:#ffffffaa;font-size:13px;z-index:2}

/* ---------- sheets & dialog ---------- */
.shade{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ink2);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:18px 18px calc(18px + var(--bot))}
@media (min-width:600px){.shade{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:19px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;font-size:15.5px}.row .t small{color:var(--dim);font-size:13px;display:block}
.sw{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--ink3);position:relative;flex:none;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked{background:var(--accent)}.sw:checked::after{left:21px}
select.sel{background:var(--ink3);border:none;border-radius:10px;padding:8px 10px;font-size:14.5px}
.opt{display:flex;gap:14px;align-items:center;width:100%;padding:14px 4px;font-size:16.5px;text-align:left;border-bottom:1px solid var(--line)}
.opt:last-child{border:none}.opt span{font-size:22px}
.dlgin{width:100%;background:var(--ink3);border:1.5px solid var(--line);border-radius:12px;padding:13px;font-size:17px;margin:6px 0 14px}
.dlgin:focus{outline:none;border-color:var(--accent)}
.dlgbtn{display:flex;gap:10px}.dlgbtn button{flex:1;padding:13px;border-radius:12px;background:var(--ink3);font-weight:700}
.dlgbtn button.p{background:var(--accent);color:var(--accent-ink)}.dlgbtn button.d{background:var(--danger);color:#2a0000}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--bot));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:600;z-index:60;max-width:88vw;text-align:center}

/* ---------- calculator (panic screen) ---------- */
#calc{background:#000;justify-content:flex-end;padding:20px 14px calc(24px + var(--bot));z-index:90}
#calc .disp{color:#fff;font-size:68px;text-align:right;padding:10px 8px;font-weight:300;overflow:hidden;white-space:nowrap}
#calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#calc .keys button{aspect-ratio:1;border-radius:50%;background:#333;color:#fff;font-size:30px}
#calc .keys button.f{background:#a5a5a5;color:#000}#calc .keys button.o{background:#ff9f0a}
#calc .keys button.z{grid-column:span 2;aspect-ratio:auto;border-radius:40px;text-align:left;padding-left:30px}
</style>
</head>
<body>

<!-- ================= LOCK / SETUP ================= -->
<div id="lock" class="view">
  <div class="lockbox" id="lockbox"></div>
</div>

<!-- ================= HOME ================= -->
<div id="home" class="view hide">
  <div class="top">
    <h2 id="vname"></h2>
    <button class="ib" id="cloudbtn" onclick="cloudTap()" aria-label="Cloud" title="Cloud">☁️</button>

    <button onclick="selMove()" id="sb-move">📁 भेजो</button>

<!-- ================= VIEWER ================= -->

</div>

<!-- ================= CALCULATOR ================= -->
<div id="calc" class="view hide">
  <div class="disp" id="cdisp">0</div>
  <div class="keys" id="ckeys"></div>
</div>

<div class="pbar" id="pbar"></div>
<div id="overlay"></div>

<script>
"use strict";
/* =====================================================================
   Locker — encrypted photo vaults (v1, on-device)
   Every vault has its own password. Password -> AES key (PBKDF2) -> unwraps a random master key.
   Photos, thumbnails and names are all AES-GCM encrypted before they touch the disk.
===================================================================== */
const $ = id => document.getElementById(id);
const te = new TextEncoder(), td = new TextDecoder();
const ITER = 200000;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(36).padStart(2, "0")).join("");
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- settings (not secret) ---------------- */
const DEF = { shake: true, shakePower: 14, hidden: true, facedown: true, curtain: true, back: true, twofinger: false, autolock: 60, quality: "balanced" };
let SET = Object.assign({}, DEF);
try{ SET = Object.assign({}, DEF, JSON.parse(localStorage.getItem("lk_set") || "{}")); }catch(e){}
function saveSet(){ try{ localStorage.setItem("lk_set", JSON.stringify(SET)); }catch(e){} }

/* ---------------- IndexedDB ---------------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open("lockerDB", 2);
  r.onupgradeneeded = e => {
    const d = r.result;
    if(e.oldVersion < 1){
      d.createObjectStore("vaults", { keyPath: "id" });
      d.createObjectStore("folders", { keyPath: "id" }).createIndex("v", "vaultId");
      d.createObjectStore("items", { keyPath: "id" }).createIndex("v", "vaultId");
      d.createObjectStore("thumbs", { keyPath: "id" });
      d.createObjectStore("blobs", { keyPath: "id" });
    }
    if(e.oldVersion < 2){
      d.createObjectStore("sync", { keyPath: "name" });     // cloud file map: name -> drive id
      d.createObjectStore("outbox", { keyPath: "name" });   // changes waiting to go to the cloud
    }
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
function idb(stores, mode, fn){
  return dbp.then(db => new Promise((res, rej) => {
    const t = db.transaction(stores, mode);
    let out;
    Promise.resolve(fn(t)).then(v => { out = v; }, rej);
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  }));
}
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbAll = (store, idx, key) => idb(store, "readonly", t => rq(idx ? t.objectStore(store).index(idx).getAll(key) : t.objectStore(store).getAll()));
const dbGet = (store, id) => idb(store, "readonly", t => rq(t.objectStore(store).get(id)));
const rawPut = (store, v) => idb(store, "readwrite", t => rq(t.objectStore(store).put(v)));
const rawDel = (stores, id) => idb(stores, "readwrite", t => Promise.all([].concat(stores).map(s => rq(t.objectStore(s).delete(id)))));
const PFX = { vaults: "v", folders: "f", items: "i", thumbs: "t", blobs: "b" };
const dbPut = async (store, v) => { const r = await rawPut(store, v); queueOp(store, v.id, "put"); return r; };
const dbDel = async (stores, id) => { await rawDel(stores, id); [].concat(stores).forEach(s => queueOp(s, id, "del")); };

/* ---------------- crypto ---------------- */
async function pbk(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function aesEnc(key, data){ const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv, ct: await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data) }; }
const aesDec = (key, o) => crypto.subtle.decrypt({ name: "AES-GCM", iv: o.iv }, key, o.ct);
const encJSON = (key, obj) => aesEnc(key, te.encode(JSON.stringify(obj)));
const decJSON = async (key, o) => JSON.parse(td.decode(await aesDec(key, o)));
const importMaster = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
const B32 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newRecKey(){ return Array.from(crypto.getRandomValues(new Uint8Array(25)), b => B32[b % 32]).join(""); }
const fmtRec = k => k.match(/.{1,5}/g).join("-");
const normRec = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "");

async function createVault(name, icon, accent, pass){
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const salt = crypto.getRandomValues(new Uint8Array(16)), recSalt = crypto.getRandomValues(new Uint8Array(16));
  const recKey = newRecKey();
  const [pk, rk, master] = await Promise.all([pbk(pass, salt, ITER), pbk(recKey, recSalt, ITER), importMaster(raw)]);
  const v = { id: uid(), salt, recSalt, iter: ITER,
    wrapPw: await aesEnc(pk, raw), wrapRec: await aesEnc(rk, raw),
    meta: await encJSON(master, { name, icon, accent }) };
  await dbPut("vaults", v);
  return { vault: v, recKey: fmtRec(recKey) };
}
async function openWith(v, kind, secret){
  const key = await pbk(kind === "rec" ? normRec(secret) : secret, kind === "rec" ? v.recSalt : v.salt, v.iter);
  const raw = new Uint8Array(await aesDec(key, kind === "rec" ? v.wrapRec : v.wrapPw));
  const master = await importMaster(raw);
  const meta = await decJSON(master, v.meta);
  return { vault: v, raw, key: master, meta };
}
async function tryUnlock(secret, kind){
  const vaults = await dbAll("vaults");
  for(const v of vaults){
    try{ return await openWith(v, kind || "pw", secret); }catch(e){}
  }
  return null;
}
async function rewrap(sess, newPass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const pk = await pbk(newPass, salt, ITER);
  const v = Object.assign({}, sess.vault, { salt, iter: ITER, wrapPw: await aesEnc(pk, sess.raw) });
  await dbPut("vaults", v); sess.vault = v;
}

/* ---------------- state ---------------- */
let S = null;              // session {vault, raw, key, meta}
let folders = [], items = [];
let path = [];             // folder id stack
let tab = "photos";
let sel = new Set();
let thumbURL = new Map();
let viewURL = null, vList = [], vIdx = 0;

/* ---------------- tiny UI helpers ---------------- */
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function shade(html){
  const d = document.createElement("div"); d.className = "shade"; d.innerHTML = '<div class="sheet" role="dialog">' + html + "</div>";
  d.addEventListener("click", e => { if(e.target === d) d.remove(); });
  $("overlay").appendChild(d); return d;
}
function closeShades(){ $("overlay").innerHTML = ""; }
function ask(title, def, opts){
  opts = opts || {};
  return new Promise(res => {

async function doUnlock(pass){

    const s = Math.ceil((failState.until - now) / 1000);
    $("lm").textContent = "बहुत गलत कोशिशें। " + (s > 90 ? Math.ceil(s / 60) + " मिनट" : s + " सेकंड") + " रुकें।"; return;

/* ---------------- data helpers ---------------- */
const kids = id => folders.filter(f => !f.trashed && (f.parent || null) === id);
const inFolder = id => items.filter(x => !x.trashed && (x.folder || null) === id);

/* ---------------- render ---------------- */
function render(){
  $("nv-photos").classList.toggle("on", tab === "photos"); $("nv-trash").classList.toggle("on", tab === "trash");
  $("fab").classList.toggle("hide", tab !== "photos");

function gotoPath(i){ path = path.slice(0, i + 1); sel.clear(); $("q").value = ""; render(); }
function goTab(t){ tab = t; path = []; sel.clear(); $("q").value = ""; render(); }

function renderGrid(){
  const q = $("q").value.trim().toLowerCase();
  let fl, it;
  if(tab === "trash"){ fl = folders.filter(f => f.trashed && !f.viaFolder); it = items.filter(x => x.trashed && !x.viaFolder); }
  else if(q){ fl = folders.filter(f => !f.trashed && f.name.toLowerCase().includes(q)); it = items.filter(x => !x.trashed && x.name.toLowerCase().includes(q)); }
  else{ const cur = path.length ? path[path.length - 1] : null; fl = kids(cur); it = inFolder(cur); }
  it = it.slice().sort((a, b) => b.ts - a.ts);
  $("rolls").innerHTML = fl.map(f => {

    return `<button class="roll" data-f="${f.id}"><b>📁 ${esc(f.name)}</b><span>${tab === "trash" ? "folder" : n + " चीज़ें"}</span></button>`;
  }).join("");

    const f = b.dataset.f; let t = 0;
    b.onclick = () => { if(sel.size || tab === "trash") toggleSel("f:" + f); else { path.push(f); render(); } };
    b.oncontextmenu = e => { e.preventDefault(); toggleSel("f:" + f); };
    b.onpointerdown = () => { t = setTimeout(() => { toggleSel("f:" + f); t = 0; }, 520); };
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => clearTimeout(t)));

      : (q ? `<div class="empty"><b>कुछ नहीं मिला</b>कोई दूसरा नाम लिखकर देखो।</div>` : `<div class="empty"><b>यहाँ अभी कुछ नहीं है</b>नीचे ＋ दबाकर फ़ोटो जोड़ो या नया फ़ोल्डर बनाओ।</div>`);

  const tiles = gw.querySelectorAll(".tile");

  tiles.forEach((t, i) => {
    io.observe(t); let timer = 0, long = false;
    t.onpointerdown = () => { long = false; timer = setTimeout(() => { long = true; toggleSel("i:" + t.dataset.i); }, 520); };
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => t.addEventListener(ev, () => clearTimeout(timer)));
    t.onclick = () => { if(long) return; if(sel.size || tab === "trash") toggleSel("i:" + t.dataset.i); else openViewer(it, i); };
    t.oncontextmenu = e => { e.preventDefault(); toggleSel("i:" + t.dataset.i); };

}
async function loadThumb(tile){
  const id = tile.dataset.i; let url = thumbURL.get(id);
  if(!url){

      url = URL.createObjectURL(new Blob([await aesDec(S.key, rec.t)], { type: "image/jpeg" })); thumbURL.set(id, url);

/* ---------------- selection ---------------- */
function toggleSel(k){ if(sel.has(k)) sel.delete(k); else sel.add(k); renderGrid(); updateSelUI(); }
function clearSel(){ sel.clear(); renderGrid(); updateSelUI(); }
function updateSelUI(){
  const on = sel.size > 0; $("selbar").classList.toggle("hide", !on); $("selcount").textContent = sel.size + " चुनी";
  const tr = tab === "trash";

const selItems = () => [...sel].filter(k => k[0] === "i").map(k => items.find(x => x.id === k.slice(2))).filter(Boolean);
const selFolders = () => [...sel].filter(k => k[0] === "f").map(k => folders.find(f => f.id === k.slice(2))).filter(Boolean);

function descendants(fid){ const out = [fid]; folders.filter(f => f.parent === fid).forEach(f => out.push(...descendants(f.id))); return out; }
async function trashFolder(f, on){
  const ids = descendants(f.id);
  for(const id of ids){
    const g = folders.find(x => x.id === id); if(!g) continue;
    if(on){ g.trashed = true; if(id !== f.id) g.viaFolder = f.id; } else if(id === f.id || g.viaFolder === f.id){ g.trashed = false; delete g.viaFolder; }
    await saveFolderMeta(g);
    for(const x of items.filter(x => x.folder === id)){
      if(on){ if(!x.trashed){ x.trashed = true; x.viaFolder = f.id; } } else if(x.viaFolder === f.id){ x.trashed = false; delete x.viaFolder; }
      await saveItemMeta(x);
    }
  }
}
async function selDelete(){
  const its = selItems(), fls = selFolders();
  if(tab === "trash"){
    if(!await sure("पक्का हटाओ?", "यह वापस नहीं आएगा।", "पक्का हटाओ")) return;
    for(const f of fls){ for(const id of descendants(f.id)){ for(const x of items.filter(x => x.folder === id)) await purge(x); await dbDel("folders", id); folders = folders.filter(g => g.id !== id); } }
    for(const x of its) await purge(x);
  } else {
    if(!await sure("Trash में भेजें?", (its.length + fls.length) + " चीज़ें Trash में जाएँगी। वहाँ से वापस ला सकते हो।", "Trash में भेजो")) return;
    for(const x of its){ x.trashed = true; await saveItemMeta(x); }
    for(const f of fls) await trashFolder(f, true);
  }
  clearSel(); render();
}
async function purge(x){ await dbDel(["items", "thumbs", "blobs"], x.id); items = items.filter(y => y.id !== x.id); const u = thumbURL.get(x.id); if(u){ URL.revokeObjectURL(u); thumbURL.delete(x.id); } }
async function selRestore(){
  for(const x of selItems()){ x.trashed = false; delete x.viaFolder; if(x.folder && (folders.find(f => f.id === x.folder) || {}).trashed) x.folder = null; await saveItemMeta(x); }
  for(const f of selFolders()){ if(f.parent && (folders.find(g => g.id === f.parent) || {}).trashed){ f.parent = null; } await trashFolder(f, false); }
  toast("वापस आ गई"); clearSel(); render();
}
async function selMove(){

async function shrink(bitmap, max, q){
  const sc = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(bitmap.width * sc)); c.height = Math.max(1, Math.round(bitmap.height * sc));
  c.getContext("2d").drawImage(bitmap, 0, 0, c.width, c.height);
  return { blob: await new Promise(r => c.toBlob(r, "image/jpeg", q)), w: c.width, h: c.height };
}

  if(r.status === 401){ C.token = ""; try{ sessionStorage.removeItem("lk_tok"); }catch(e){} const e = new Error("401"); e.status = 401; throw e; }
  if((r.status === 429 || r.status === 403 || r.status >= 500) && !retry){ await sleep(1200); return gfetch(url, opt, true); }
  if(!r.ok && r.status !== 404){ const e = new Error("drive " + r.status); e.status = r.status; throw e; }
  return r;
}
const pool = async (list, n, fn) => { let i = 0; await Promise.all(Array.from({ length: Math.min(n, list.length) }, async () => { while(i < list.length){ const x = list[i++]; await fn(x); } })); };
const cat = (iv, ct) => { const o = new Uint8Array(12 + ct.byteLength); o.set(new Uint8Array(iv), 0); o.set(new Uint8Array(ct), 12); return o; };
const uncat = b => ({ iv: new Uint8Array(b.slice(0, 12)), ct: b.slice(12) });
const b64 = u => { let s = ""; const a = new Uint8Array(u); for(let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); };
const unb64 = t => { const s = atob(t), a = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
const wrapJ = w => ({ iv: b64(w.iv), ct: b64(w.ct) }), unwrapJ = w => ({ iv: unb64(w.iv), ct: unb64(w.ct).buffer });
function encodeRec(store, r){
  if(store === "vaults") return { bytes: te.encode(JSON.stringify({ id: r.id, iter: r.iter, salt: b64(r.salt), recSalt: b64(r.recSalt), wrapPw: wrapJ(r.wrapPw), wrapRec: wrapJ(r.wrapRec), meta: wrapJ(r.meta) })), props: {} };
  if(store === "folders" || store === "items") return { bytes: cat(r.enc.iv, r.enc.ct), props: { vaultId: r.vaultId } };
  if(store === "thumbs") return { bytes: cat(r.t.iv, r.t.ct), props: {} };
  return { bytes: cat(r.d.iv, r.d.ct), props: {} };
}
function decodeRec(kind, id, buf, props){
  if(kind === "v"){ const j = JSON.parse(td.decode(buf)); return { id, iter: j.iter, salt: unb64(j.salt), recSalt: unb64(j.recSalt), wrapPw: unwrapJ(j.wrapPw), wrapRec: unwrapJ(j.wrapRec), meta: unwrapJ(j.meta) }; }
  if(kind === "f" || kind === "i") return { id, vaultId: (props || {}).vaultId, enc: uncat(buf) };
  if(kind === "t") return { id, t: uncat(buf) };
  return { id, d: uncat(buf) };
}
async function listRemote(){
  let out = [], tok = "";
  do{
    const r = await gfetch(DRIVE + "?spaces=appDataFolder&pageSize=1000&fields=" + encodeURIComponent("nextPageToken,files(id,name,modifiedTime,appProperties)") + (tok ? "&pageToken=" + tok : ""));
    const j = await r.json(); out = out.concat(j.files || []); tok = j.nextPageToken || "";
  }while(tok);
  return out;
}
async function dlFile(fid){ const r = await gfetch(DRIVE + "/" + fid + "?alt=media"); if(r.status === 404) return null; return r.arrayBuffer(); }
async function upFile(name, bytes, props, fid){
  if(fid){
    const r = await gfetch(UPLOAD + "/" + fid + "?uploadType=media&fields=id,modifiedTime", { method: "PATCH", headers: { "Content-Type": "application/octet-stream" }, body: bytes });
    if(r.status !== 404) return r.json();
  }
  const bd = "lkb" + uid(), meta = JSON.stringify({ name, parents: ["appDataFolder"], appProperties: props });
  const body = new Blob(["--" + bd + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + meta + "\r\n--" + bd + "\r\nContent-Type: application/octet-stream\r\n\r\n", bytes, "\r\n--" + bd + "--"]);
  const r = await gfetch(UPLOAD + "?uploadType=multipart&fields=id,modifiedTime", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + bd }, body });
  return r.json();
}
function queueOp(store, id, op){
  if(!C.on || !PFX[store]) return;
  rawPut("outbox", { name: PFX[store] + "_" + id, op, ts: Date.now() }).then(() => { C.pending = true; cloudKick(); }).catch(() => {});
}
function cloudKick(){ clearTimeout(C.timer); C.timer = setTimeout(() => syncNow("push"), 1500); if(C.state !== "warn") cloudUI(cloudReady() ? "sync" : "wait"); }
async function push(){
  const ob = await dbAll("outbox"); if(!ob.length) return;
  const sy = new Map((await dbAll("sync")).map(x => [x.name, x]));
  const puts = ob.filter(o => o.op === "put"), dels = ob.filter(o => o.op === "del");
  await pool(puts, 4, async o => {
    const kind = o.name[0], id = o.name.slice(2), store = STORE_OF[kind], rec = await dbGet(store, id);
    if(!rec){ await rawDel("outbox", o.name); return; }
    const e = encodeRec(store, rec), s = sy.get(o.name);
    const res = await upFile(o.name, e.bytes, e.props, s && s.fid);
    await rawPut("sync", { name: o.name, fid: res.id, mt: res.modifiedTime });
    const cur = await dbGet("outbox", o.name); if(cur && cur.ts === o.ts) await rawDel("outbox", o.name);
  });
  await pool(dels, 4, async o => {
    const s = sy.get(o.name);
    if(s){ await gfetch(DRIVE + "/" + s.fid, { method: "DELETE" }); await rawDel("sync", o.name); }
    await rawDel("outbox", o.name);
  });
}
async function pull(onlyVaults){
  const remote = await listRemote();
  const sy = new Map((await dbAll("sync")).map(x => [x.name, x]));
  const ob = new Set((await dbAll("outbox")).map(x => x.name));
  const rn = new Set(remote.map(f => f.name));
  const todo = []; let changedMeta = false, got = 0;
  for(const f of remote){
    const k = f.name[0]; if(!STORE_OF[k] || f.name[1] !== "_") continue;
    if(onlyVaults && k !== "v") continue;
    if(ob.has(f.name)) continue;
    const s = sy.get(f.name);
    if(s && s.mt === f.modifiedTime && s.fid === f.id) continue;
    todo.push(f);
  }
  await pool(todo, 6, async f => {
    const k = f.name[0], id = f.name.slice(2);
    if(k === "t" || k === "b"){ await rawPut("sync", { name: f.name, fid: f.id, mt: f.modifiedTime }); if(sy.has(f.name)) await rawDel(STORE_OF[k], id); return; } // fetched later, on demand
    const buf = await dlFile(f.id); if(!buf) return;
    await rawPut(STORE_OF[k], decodeRec(k, id, buf, f.appProperties));
    await rawPut("sync", { name: f.name, fid: f.id, mt: f.modifiedTime });
    if(k === "f" || k === "i") changedMeta = true; got++;
  });
  if(!onlyVaults){
    for(const s of sy.values()){
      if(rn.has(s.name) || ob.has(s.name)) continue;
      const k = s.name[0], id = s.name.slice(2);
      await rawDel(STORE_OF[k], id); await rawDel("sync", s.name); if(k === "f" || k === "i") changedMeta = true;
    }
    // first connect: everything local that the cloud has never seen goes up
    for(const [k, store] of Object.entries(STORE_OF)){
      for(const key of await idb(store, "readonly", t => rq(t.objectStore(store).getAllKeys()))){
        const n = k + "_" + key; if(!sy.has(n) && !rn.has(n) && !ob.has(n)) await rawPut("outbox", { name: n, op: "put", ts: Date.now() });
      }
    }
  }
  if(changedMeta && S) await reloadVault();
  return got;
}
async function reloadVault(){
  if(!S) return;
  const [fr, it] = await Promise.all([dbAll("folders", "v", S.vault.id), dbAll("items", "v", S.vault.id)]);
  const nf = [], ni = [];
  for(const f of fr){ try{ nf.push(Object.assign({ id: f.id }, await decJSON(S.key, f.enc))); }catch(e){} }
  for(const x of it){ try{ ni.push(Object.assign({ id: x.id }, await decJSON(S.key, x.enc))); }catch(e){} }
  folders = nf; items = ni;
  path = path.filter(id => folders.some(f => f.id === id && !f.trashed));
  if(!$("viewer").classList.contains("hide")) return;
  render();
}
async function syncNow(mode){
  if(!C.on || C.busy) return;
  if(!cloudReady()){ cloudUI(!navigator.onLine ? "wait" : (C.token ? "wait" : "warn")); return; }
  C.busy = true; cloudUI("sync");
  try{ if(mode !== "push") await pull(); await push(); C.err = ""; cloudUI("ok"); }
  catch(e){ console.error(e); if(e.status === 401){ C.err = "Google से दोबारा जोड़ो"; cloudUI("warn"); } else { C.err = "जमा नहीं हो पाया, दोबारा कोशिश होगी"; cloudUI("warn"); setTimeout(() => cloudKick(), 20000); } }
  finally{ C.busy = false; }
}
function cloudStart(){
  cloudUI(!C.on ? "off" : (cloudReady() ? "sync" : (C.token ? "wait" : "warn")));
  if(C.on){ syncNow(); }
  clearInterval(C.poll);
  C.poll = setInterval(() => { if(C.on && S && !document.hidden) syncNow(); }, 60000);
}
addEventListener("online", () => { if(C.on) syncNow(); });
async function getThumbRec(id){
  const l = await dbGet("thumbs", id); if(l) return l;
  if(!cloudReady()) return null; const s = await dbGet("sync", "t_" + id); if(!s) return null;
  try{ const b = await dlFile(s.fid); if(!b) return null; const rec = { id, t: uncat(b) }; await rawPut("thumbs", rec); return rec; }catch(e){ return null; }
}
async function getBlobRec(id){
  const l = await dbGet("blobs", id); if(l) return l;
  if(!cloudReady()) throw new Error("offline"); const s = await dbGet("sync", "b_" + id); if(!s) throw new Error("missing");
  const b = await dlFile(s.fid); if(!b) throw new Error("missing"); const rec = { id, d: uncat(b) }; await rawPut("blobs", rec); return rec;
}
async function restoreFromCloud(){
  if(!await cloudConnect()) return;
  $("lockbox").innerHTML = LOGO + "<h1>Google से ला रहे हैं…</h1><p class='sub'>अपना vault खोज रहे हैं।</p>";
  try{
    await pull(true); const n = (await dbAll("vaults")).length;
    if(!n){ C.on = false; saveCloud(); cloudUI("off"); renderLockForm(""); $("lm").textContent = "इस Google खाते में कोई Locker नहीं मिला।"; setTimeout(() => showLock(), 2500); return; }
    renderLockForm(n + " vault मिले। अपना पासवर्ड डालो।");
  }catch(e){ console.error(e); renderLockForm(""); $("lm").textContent = "Google Drive से नहीं ला पाए। दोबारा कोशिश करो।"; }
}
function renderCloudBox(box){
  if(!box) return;
  const used = "";
  if(!C.on){
    box.innerHTML = `<div class="row"><div class="t"><b>अभी बंद है</b><small>फ़ोटो सिर्फ़ इसी डिवाइस में हैं।</small></div></div><button class="opt" id="cc1"><span>☁️</span>Google से जोड़ो</button>`;

    <button class="opt" id="cc2"><span>🔄</span>अभी sync करो</button><button class="opt" id="cc3"><span>🔑</span>Google से दोबारा जोड़ो</button><button class="opt" id="cc4"><span>⛔</span>Cloud बंद करो</button>`;

/* ---------------- backup file (everything stays encrypted) ---------------- */
const J = (k, v) => (v instanceof ArrayBuffer || ArrayBuffer.isView(v)) ? { $b: b64(v) } : v;
const unJ = (k, v) => (v && typeof v === "object" && v.$b !== undefined) ? unb64(v.$b) : v;
async function exportBackup(){
  toast("Backup बन रहा है…");
  try{
    const parts = ["LKB1\n"];
    for(const store of ["vaults", "folders", "items", "thumbs", "blobs"]){
      const all = await dbAll(store);
      for(const r of all){ parts.push(JSON.stringify({ s: store, r }, J) + "\n"); }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(parts, { type: "application/octet-stream" }));
    a.download = "Locker_backup_" + new Date().toISOString().slice(0, 10) + ".locker"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000); toast("Backup फ़ाइल तैयार (ताले में है)");
  }catch(e){ console.error(e); toast("Backup नहीं बन पाया"); }
}
async function importBackup(file){
  try{
    const reader = file.stream().pipeThrough(new TextDecoderStream()).getReader();
    let buf = "", first = true, n = 0;
    const handle = async line => {
      if(!line) return;
      if(first){ first = false; if(line !== "LKB1") throw new Error("bad"); return; }
      const o = JSON.parse(line, unJ);
      if(o.r.d && o.r.d.ct && !(o.r.d.ct instanceof ArrayBuffer)) o.r.d.ct = o.r.d.ct.buffer;
      for(const k of ["t", "d", "enc", "wrapPw", "wrapRec", "meta"]) if(o.r[k] && o.r[k].ct && !(o.r[k].ct instanceof ArrayBuffer)) o.r[k].ct = o.r[k].ct.buffer;
      await dbPut(o.s, o.r); n++;
    };
    for(;;){
      const { value, done } = await reader.read(); if(done) break;
      buf += value; let i; while((i = buf.indexOf("\n")) >= 0){ await handle(buf.slice(0, i)); buf = buf.slice(i + 1); }
    }
    await handle(buf);
    if(S) await reloadVault();
    toast(n + " चीज़ें वापस आईं");
  }catch(e){ console.error(e); toast("यह Backup फ़ाइल सही नहीं लगी"); }
}
